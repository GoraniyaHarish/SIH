# PRAMANA — competency intelligence platform for India's Official Statistical System.
#
# Local setup:
#   cp .env.example .env
#   Set unique POSTGRES_PASSWORD and JWT_SECRET values in .env.
#   docker compose up --build -d
#   docker compose exec -e ALLOW_DEMO_SEED=1 -e DEMO_PASSWORD='your-private-password' api python seed.py
#   open http://localhost:3000
#
# The database image ships pgvector, so no extra extension image is required.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pramana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pramana
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramana -d pramana"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://pramana:${POSTGRES_PASSWORD}@db:5432/pramana
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-5-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_SEND_DOCUMENTS_EXTERNALLY: ${AI_SEND_DOCUMENTS_EXTERNALLY:-false}
      IGOT_BASE_URL: ${IGOT_BASE_URL:-}
      IGOT_API_TOKEN: ${IGOT_API_TOKEN:-}
      NSSTA_BASE_URL: ${NSSTA_BASE_URL:-}
      NSSTA_API_TOKEN: ${NSSTA_API_TOKEN:-}
      UPLOAD_DIR: /srv/app/storage/uploads
    volumes:
      - uploads:/srv/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  uploads:
