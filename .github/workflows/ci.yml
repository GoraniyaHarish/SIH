name: PRAMANA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "pramana-judge-review-stabilization"]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pramana
          POSTGRES_PASSWORD: pramana_ci_password
          POSTGRES_DB: pramana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pramana -d pramana_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure pgvector extension exists
        env:
          PGPASSWORD: pramana_ci_password
        run: psql -h localhost -U pramana -d pramana_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run backend test suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pramana:pramana_ci_password@localhost:5432/pramana_test
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pramana-api:ci ./backend
      - name: Build frontend image
        run: docker build -t pramana-web:ci ./frontend

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Verify patched React Router version
        working-directory: frontend
        run: node -e "const p = require('./package-lock.json'); const v = p.packages['node_modules/react-router-dom']?.version; console.log('react-router-dom', v); if (v !== '7.18.5') process.exit(1)"
  compose-e2e:
    name: Clean Compose deployment and browser role journeys
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: pramana-ci-${{ github.run_id }}-${{ github.run_attempt }}
      JWT_SECRET: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-replace-before-deployment
      WEB_PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create private demonstration password
        shell: bash
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "PRAMANA_DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start a clean production-mode Compose stack
        run: docker compose up --build --detach
      - name: Verify database migration, API readiness and web proxy
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3000/api/health -o /tmp/pramana-health.json; then
              break
            fi
            sleep 5
          done
          test -s /tmp/pramana-health.json
          python - <<'PY'
          import json
          with open("/tmp/pramana-health.json", encoding="utf-8") as handle:
              health = json.load(handle)
          assert health["status"] == "ok", health
          assert health["database"] == "ok", health
          assert health["redis"] == "ok", health
          assert health["ai"] == "not_configured", health
          assert "igot_karmayogi:not_configured" in health["integrations"], health
          assert "nssta:not_configured" in health["integrations"], health
          print("Compose health:", json.dumps(health, sort_keys=True))
          PY
          version="$(docker compose exec -T db psql -U pramana -d pramana -tAc 'SELECT version_num FROM alembic_version')"
          test -n "$version"
          echo "Alembic schema revision: $version"
          curl --fail --silent http://localhost:3000/login | grep -q 'root'
          curl --fail --silent http://localhost:3000/api/docs | grep -qi 'swagger'
      - name: Seed isolated CI-only demonstration accounts
        shell: bash
        env:
          DEMO_PASSWORD: ${{ env.PRAMANA_DEMO_PASSWORD }}
        run: |
          docker compose exec -T -e DEMO_PASSWORD="$DEMO_PASSWORD" -e ALLOW_DEMO_SEED=1 api python seed.py > /tmp/pramana-seed.log 2>&1 || {
            tail -n 40 /tmp/pramana-seed.log
            exit 1
          }
          grep -q "Seed complete" /tmp/pramana-seed.log
          rm -f /tmp/pramana-seed.log
      - name: Install Playwright browser
        run: |
          npm install --prefix /tmp/pramana-e2e --no-save playwright
          /tmp/pramana-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise learner, manager, assessor and admin journeys
        env:
          PLAYWRIGHT_MODULE: /tmp/pramana-e2e/node_modules/playwright/index.mjs
          PRAMANA_BASE_URL: http://localhost:3000
          PRAMANA_DEMO_PASSWORD: ${{ env.PRAMANA_DEMO_PASSWORD }}
        run: node frontend/e2e/roles.mjs
      - name: Show Compose logs on failure and clean up
        if: always()
        run: |
          docker compose logs --no-color --tail=100 || true
          docker compose down --volumes --remove-orphans
