name: PRAMANA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "pramana-judge-review-stabilization"]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pramana
          POSTGRES_PASSWORD: pramana_ci_password
          POSTGRES_DB: pramana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pramana -d pramana_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure pgvector extension exists
        env:
          PGPASSWORD: pramana_ci_password
        run: psql -h localhost -U pramana -d pramana_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run backend test suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pramana:pramana_ci_password@localhost:5432/pramana_test
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  frontend-build:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pramana-api:ci ./backend
      - name: Build frontend image
        run: docker build -t pramana-web:ci ./frontend

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Verify patched React Router version
        working-directory: frontend
        run: npm ls react-router-dom
